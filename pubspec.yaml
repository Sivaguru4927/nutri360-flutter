name: nutri360
description: >
  Nutri360 — Pediatric Health Surveillance, Nutrition Tracking &
  Neurodevelopmental Screening for Parents & Anganwadi Workers.
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── Backend / Auth ─────────────────────────────────────────
  supabase_flutter: ^2.5.0          # Supabase Auth + PostgreSQL queries
  flutter_dotenv: ^5.1.0            # Loads .env file; keeps API keys OUT of source code

  # ── Navigation ─────────────────────────────────────────────
  go_router: ^14.0.0                # Declarative routing (replaces Expo Router)

  # ── State Management ───────────────────────────────────────
  provider: ^6.1.0                  # Lightweight reactive state (ChangeNotifier)
  riverpod: ^2.5.0                  # Optional: for complex async state (gaze, BLE)
  flutter_riverpod: ^2.5.0

  # ── Local Offline Database ─────────────────────────────────
  hive_flutter: ^1.1.0              # Fast key-value DB (replaces AsyncStorage)
  hive: ^2.2.3
  shared_preferences: ^2.3.0       # Tiny flag storage (language pref, remember-me)

  # ── Charts & Visualisation ─────────────────────────────────
  fl_chart: ^0.69.0                 # Growth curves, nutrition trends (replaces SVG charts)

  # ── Camera & Media ─────────────────────────────────────────
  camera: ^0.11.0                   # Live camera feed for food photo + gaze
  image_picker: ^1.1.0              # Pick from gallery or camera roll

  # ── ML / AI ────────────────────────────────────────────────
  tflite_flutter: ^0.10.4           # MobileNet food recognition (native TFLite, replaces TF.js WASM)
  google_mlkit_face_detection: ^0.11.0  # On-device face/eye landmark (replaces MediaPipe WebGazer)
  google_mlkit_image_labeling: ^0.9.0   # Fallback image labelling

  # ── Bluetooth / IoT ────────────────────────────────────────
  flutter_blue_plus: ^1.32.0        # BLE NutriBand scale sync (replaces react-native-ble-plx)
  permission_handler: ^11.3.0       # Runtime permissions (camera, BLE, location)

  # ── Internationalisation (7 languages) ────────────────────
  easy_localization: ^3.0.7         # EN / HI / TE / TA / KN / BN / MR
  intl: ^0.19.0                     # Date/number formatting

  # ── Utilities ──────────────────────────────────────────────
  http: ^1.2.0                      # REST calls (food recognition API fallback)
  connectivity_plus: ^6.0.3         # Watch network status → trigger offline queue flush
  uuid: ^4.4.0                      # Generate share-code IDs
  crypto: ^3.0.3                    # SHA-256 for password hashing (local demo fallback)
  path_provider: ^2.1.0             # File paths for Hive DB storage

  # ── UI Helpers ─────────────────────────────────────────────
  flutter_animate: ^4.5.0           # Smooth animations (replaces Reanimated)
  cached_network_image: ^3.3.0      # Profile/child photo caching
  shimmer: ^3.0.0                   # Skeleton loading placeholders
  badges: ^3.1.2                    # Notification badges on tab icons
  gap: ^3.0.1                       # Semantic spacing widget

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1            # Auto-generates Hive type adapters
  build_runner: ^2.4.9
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # ── Asset declarations ────────────────────────────────────
  assets:
    - assets/images/                # logo, splash, icons
    - assets/models/                # MobileNet .tflite model
    - assets/translations/          # JSON locale files
    - .env                          # Environment variables

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
