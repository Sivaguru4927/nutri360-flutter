name: nutri360
description: >
  Nutri360 — Pediatric Health Surveillance, Nutrition Tracking &
  Neurodevelopmental Screening for Parents & Anganwadi Workers.
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── Backend / Auth ─────────────────────────────────────────
  supabase_flutter: ^2.5.0
  flutter_dotenv: ^5.1.0

  # ── Navigation ─────────────────────────────────────────────
  go_router: ^14.0.0

  # ── State Management ───────────────────────────────────────
  provider: ^6.1.0

  # ── Local Offline Database ─────────────────────────────────
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  shared_preferences: ^2.3.0

  # ── Charts & Visualisation ─────────────────────────────────
  fl_chart: ^0.69.0

  # ── Camera & Media ─────────────────────────────────────────
  image_picker: ^1.1.0

  # ── Internationalisation (7 languages) ────────────────────
  easy_localization: ^3.0.7
  intl: ^0.19.0

  # ── Utilities ──────────────────────────────────────────────
  http: ^1.2.0
  connectivity_plus: ^6.0.3

  # ── UI Helpers ─────────────────────────────────────────────
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # ── Assets ────────────────────────────────────────────────
  assets:
    - assets/images/
    - assets/translations/
    - .env
